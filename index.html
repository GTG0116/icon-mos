<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ICON-MOS Map</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.css">
<style>
:root{--bg:#f4f5f7;--panel:#fff;--ink:#1c2230;--muted:#5b6474;--line:#dde1e7;--acc:#1f5fbf;--acc-ink:#fff;--hi:#eaf1fc}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--panel:#1d2128;--ink:#e6e9ee;--muted:#9aa3b2;--line:#2e343e;--acc:#5b9cf5;--acc-ink:#0b1220;--hi:#232b38}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:17px;margin:0 8px 0 0;letter-spacing:.3px}
header h1 span{color:var(--muted);font-weight:500;font-size:13px;margin-left:6px}
header a{margin-left:auto;color:var(--acc);text-decoration:none;border:1px solid var(--line);border-radius:6px;padding:5px 12px}
select,button,input{font:inherit;color:inherit}
select{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}
.wrap{flex:1;display:grid;grid-template-columns:272px 1fr;min-height:0}
@media (max-width:760px){.wrap{grid-template-columns:1fr;grid-template-rows:auto 1fr}.side{max-height:40vh;border-right:0;border-bottom:1px solid var(--line)}}
/* ---- sidebar: cards with grouped data options, switches and sliders */
.side{background:var(--bg);border-right:1px solid var(--line);padding:12px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card-h{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:650;letter-spacing:.2px;margin:0 0 10px}
.card-h svg{width:16px;height:16px;flex:none;color:var(--acc)}
.card-h .grow{flex:1}
.grp{margin-top:10px}
.grp:first-child{margin-top:0}
.grp-h{font-size:10.5px;font-weight:600;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 2px 5px}
.prods{display:flex;flex-direction:column;gap:2px}
.prod{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;border-radius:8px;padding:6px 8px;cursor:pointer;font-size:13.5px;position:relative;transition:background .12s}
.prod:hover:not(.on){background:var(--hi)}
.prod .sw{width:26px;height:10px;border-radius:5px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.prod.on{background:var(--hi);color:var(--acc);font-weight:600}
.prod.on::before{content:"";position:absolute;left:-12px;top:6px;bottom:6px;width:3px;border-radius:0 3px 3px 0;background:var(--acc)}
.prod:focus-visible,.seg button:focus-visible,.btn:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.ctl{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px}
.ctl>span:first-child{flex:1}
.ctl .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px;min-width:44px;text-align:right}
.slider{display:block;padding:4px 2px 6px;font-size:13px}
.slider .top{display:flex;justify-content:space-between;margin-bottom:4px}
.slider .top .val{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
input[type=range].rng{-webkit-appearance:none;appearance:none;width:100%;height:4px;border-radius:2px;background:var(--line);outline:none;margin:6px 0}
input[type=range].rng::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--panel);border:2px solid var(--acc);cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
input[type=range].rng::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--panel);border:2px solid var(--acc);cursor:pointer}
input[type=range].rng::-moz-range-progress{background:var(--acc);height:4px;border-radius:2px}
.tg{-webkit-appearance:none;appearance:none;width:32px;height:18px;border-radius:9px;background:var(--line);position:relative;cursor:pointer;flex:none;transition:background .15s;margin:0}
.tg::after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.tg:checked{background:var(--acc)}
.tg:checked::after{transform:translateX(14px)}
.tg:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.seg{display:flex;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:2px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.dim{opacity:.45;pointer-events:none}
.side select,.side input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 6px;font-size:13px}
.side input[type=number]{width:72px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:5px 12px;cursor:pointer;font-size:13px}
.btn:hover:not(:disabled){background:var(--hi)}
.btn.primary{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.primary:hover:not(:disabled){filter:brightness(1.08);background:var(--acc)}
.btn:disabled{opacity:.5;cursor:default}
#cap_msg{color:var(--muted);font-size:12px;min-height:1.4em;padding:2px}
.hint{color:var(--muted);font-size:12px;margin:0 4px;line-height:1.5}
#particles{position:absolute;inset:0;z-index:1;pointer-events:none}
.main{display:flex;flex-direction:column;min-width:0;min-height:0}
#map{flex:1;min-height:300px;position:relative}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 12px;background:var(--panel);border-top:1px solid var(--line)}
.bar button{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 12px;cursor:pointer}
.bar input[type=range]{flex:1;min-width:160px;accent-color:var(--acc)}
.bar .lbl{font-variant-numeric:tabular-nums;min-width:250px;color:var(--muted)}
.box{position:absolute;z-index:2;background:rgba(255,255,255,.93);color:#1c2230;border-radius:6px;box-shadow:0 1px 4px rgba(0,0,0,.25);font-size:12px}
#legend{left:10px;bottom:28px;padding:6px 10px 4px}
#legend .t{font-weight:600;margin-bottom:3px}
#readout{left:10px;top:10px;padding:5px 9px;font-variant-numeric:tabular-nums;min-width:120px}
#readout b{font-size:15px}
#loading{right:50px;top:10px;padding:4px 9px}
#shield{position:absolute;inset:0;z-index:5;cursor:progress}
#fc{left:50%;top:10px;transform:translateX(-50%);z-index:3;padding:9px 12px 8px;max-width:calc(100% - 20px);max-height:calc(100% - 20px);overflow:auto;background:rgba(255,255,255,.97)}
#fc .hd{display:flex;gap:8px;align-items:flex-start}
#fc .hd b{font-size:14px}
#fc .sub{color:#5b6474}
#fc .x{margin-left:auto;border:0;background:none;font-size:20px;line-height:16px;cursor:pointer;color:#5b6474;padding:0 2px}
#fc .x:hover{color:#1c2230}
#fc .now{color:#1c2230;margin:3px 0 6px;font-variant-numeric:tabular-nums}
#fc .sc{overflow-x:auto}
#fc .days{display:grid;grid-auto-flow:column;grid-auto-columns:96px}
#fc .day{text-align:center;padding:2px 3px 6px;border-left:1px solid #e6e8ec}
#fc .day:first-child{border-left:0}
#fc .dn{font-weight:600;font-size:13px}
#fc .dd{color:#5b6474;font-size:11px}
#fc .day svg{display:block;margin:2px auto 0}
#fc .cond{min-height:30px;line-height:1.2;margin:1px 0 3px;display:flex;align-items:center;justify-content:center}
#fc .hl{font-size:16px;font-variant-numeric:tabular-nums;margin-bottom:2px}
#fc .hi{color:#c62828;font-weight:700}
#fc .lo{color:#1f5fbf;font-weight:600}
#fc .row{font-variant-numeric:tabular-nums;line-height:1.45}
#fc .k{color:#5b6474}
#fc .chart{display:block;cursor:pointer;margin-top:2px}
#fc .key{color:#5b6474;font-size:11px;margin-top:3px}
#fc .key i{display:inline-block;width:14px;height:3px;vertical-align:middle;margin:0 3px 0 8px}
#fc .key i:first-child{margin-left:0}
.empty{padding:40px;text-align:center;color:var(--muted)}
</style></head>
<body>
<header>
  <h1>ICON-MOS<span id="dom"></span></h1>
  <label>Run <select id="run"></select></label>
  <a href="tables.html">Runs &amp; station tables</a>
</header>
<div class="wrap">
  <aside class="side">
    <section class="card">
      <div class="card-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 8l10 5 10-5-10-5z"/><path d="m2 16 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg>Data</div>
      <div id="prods"></div>
    </section>
    <section class="card" id="windcard" hidden>
      <div class="card-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h10a3 3 0 1 0-3-3"/><path d="M3 12h15a3 3 0 1 1-3 3"/><path d="M3 16h7"/></svg><span class="grow">Wind particles</span>
        <input type="checkbox" class="tg" id="p_on" checked aria-label="Show wind particles"></div>
      <div id="p_opts">
        <label class="slider"><div class="top"><span>Speed</span><span class="val" id="p_speed_v"></span></div>
          <input type="range" class="rng" id="p_speed" min="0.25" max="4" step="0.25" value="1"></label>
        <label class="slider"><div class="top"><span>Density</span><span class="val" id="p_dens_v"></span></div>
          <input type="range" class="rng" id="p_dens" min="1" max="40" step="1" value="8"></label>
        <label class="slider"><div class="top"><span>Trail length</span><span class="val" id="p_trail_v"></span></div>
          <input type="range" class="rng" id="p_trail" min="0" max="1" step="0.05" value="0.6"></label>
        <div class="ctl"><span>Color</span><div class="seg" id="p_col"><button data-v="dark" class="on">Dark</button><button data-v="light">Light</button></div></div>
      </div>
    </section>
    <section class="card">
      <div class="card-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2z"/><path d="M9 4v14M15 6v14"/></svg>Map layers</div>
      <label class="ctl"><span>Values at cities</span><input type="checkbox" class="tg" id="o_vals" checked></label>
      <label class="ctl"><span>Roads</span><input type="checkbox" class="tg" id="o_roads" checked></label>
      <label class="ctl"><span>County lines</span><input type="checkbox" class="tg" id="o_cnty" checked></label>
      <label class="ctl" title="Isobars on the pressure map, 500 mb heights on the 500 mb maps"><span>Isobars &amp; heights</span><input type="checkbox" class="tg" id="o_cont" checked></label>
      <label class="slider"><div class="top"><span>Data opacity</span><span class="val" id="o_op_v"></span></div>
        <input type="range" class="rng" id="o_op" min="0.3" max="1" step="0.05" value="0.85"></label>
    </section>
    <section class="card">
      <div class="card-h"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>Capture</div>
      <div class="ctl"><button class="btn" id="shot" title="This frame as a PNG, with the valid time, model run and legend" style="width:100%">Screenshot</button></div>
      <label class="ctl"><span>From</span><select id="cap_a"></select> to <select id="cap_b"></select></label>
      <label class="ctl"><span>Each frame</span><input type="number" id="cap_ms" min="20" max="60000" step="50" value="500"> ms</label>
      <div class="ctl"><span>Format</span><select id="cap_fmt" aria-label="Format"><option value="mp4">MP4</option><option value="gif">GIF</option></select>
        <button class="btn primary" id="rec">Record</button></div>
      <div id="cap_msg"></div>
    </section>
    <p class="hint">Hover for the value, click anywhere for that spot's 5- or 7-day forecast (Esc closes it). Keys: &larr; &rarr; hour, Space play, &uarr; &darr; product.</p>
  </aside>
  <div class="main">
    <div id="map">
      <canvas id="particles"></canvas>
      <div class="box" id="readout" hidden></div>
      <div class="box" id="legend"></div>
      <div class="box" id="loading" hidden>Loading…</div>
      <div class="box" id="fc" hidden></div>
      <div id="shield" hidden title="Recording…"></div>
    </div>
    <div class="bar">
      <button id="prev" title="Previous (Left arrow)">&#9664;</button>
      <button id="play" title="Play / pause (Space)">Play</button>
      <button id="next" title="Next (Right arrow)">&#9654;</button>
      <input type="range" id="slider" min="0" value="0">
      <span class="lbl" id="lbl"></span>
    </div>
  </div>
</div>
<script src="runs.js?v=202610062255"></script>
<script src="https://unpkg.com/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script>
(function(){
const $=id=>document.getElementById(id);
const M=window.ICONMOS, RUNS=M?M.runs.filter(r=>r.map&&r.map.grid):[];
if(!RUNS.length||!window.maplibregl||!location.protocol.startsWith('http')){
  document.querySelector('.wrap').innerHTML='<div class="empty">'+(!location.protocol.startsWith('http')?'The interactive map needs the viewer server: run <code>mos.bat view</code>.':
    !window.maplibregl?'Could not load the map library (no internet?).':'No runs with map data yet. Run <code>mos.bat run</code> or use New run… on the <a href="tables.html">Runs</a> page.')+'</div>';return;}
const store=(k,v)=>{try{localStorage.setItem('iconmos.'+k,v)}catch(e){}};
const recall=k=>{try{return localStorage.getItem('iconmos.'+k)}catch(e){return null}};
const ST=M.map_styles, pad=h=>String(h).padStart(3,'0');
const st={run:null,prod:recall('prod')||'mos_t2m',k:0,timer:null,v:null,dirv:null,token:0,rec:false};
$('dom').textContent=' — '+M.domain+(M.static?' · updated '+M.generated:'');
RUNS.forEach(r=>$('run').add(new Option(r.label+(r.source==='aws'?'  (archive)':''),r.id)));
const run=()=>RUNS.find(r=>r.id===st.run), meta=()=>run().map;
const STATIC=!!M.static;   // the published copy: no server, so point forecasts and terrain come from files
// direction frames that go with a wind product ('wdir' 10 m, 'wdir500'), if the run has them
const dirName=p=>{const d=ST[p].dir, have=meta().dirs||(meta().dir?['wdir']:[]);return d&&have.includes(d)?d:null};
const contourName=p=>{const c=ST[p].contour;return c&&(meta().contours||[]).includes(c)?c:null};

// ---- frame data: gzipped uint16 with an offset/scale header
const cache=new Map();
async function fetchBin(url){
  const res=await fetch(url);
  if(!res.ok)throw new Error(res.status);
  let buf=await res.arrayBuffer(); const b=new Uint8Array(buf,0,Math.min(2,buf.byteLength));
  // gunzip here unless the server already did (static hosts may send .gz files either way)
  if(b[0]===0x1f&&b[1]===0x8b)buf=await new Response(new Blob([buf]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer();
  return buf;
}
async function load(url){
  const buf=await fetchBin(url);
  const dv=new DataView(buf), lo=dv.getFloat32(0,true), sc=dv.getFloat32(4,true), q=new Uint16Array(buf,8);
  const v=new Float32Array(q.length); for(let i=0;i<q.length;i++)v[i]=q[i]===65535?NaN:lo+q[i]*sc;
  return v;
}
function lru(map,key,make,max){
  if(map.has(key)){const v=map.get(key);map.delete(key);map.set(key,v);return v}
  const p=make(); map.set(key,p); if(map.size>max)map.delete(map.keys().next().value);
  p.catch(()=>map.delete(key)); return p;
}
function frame(name,h){const r=run();
  return lru(cache,r.id+'/'+name+'/'+h+'/'+r.stamp,()=>load('runs/'+r.id+'/data/'+name+'_'+pad(h)+'.bin.gz?v='+r.stamp),240)}
// contour lines (isobars, 500 mb heights) of a frame, GeoJSON
const lineCache=new Map(), EMPTY={type:'FeatureCollection',features:[]};
function contourLines(name,h){const r=run();
  return lru(lineCache,r.id+'/'+name+'/'+h+'/'+r.stamp,()=>fetch('runs/'+r.id+'/data/contour_'+name+'_'+pad(h)+'.json?v='+r.stamp)
    .then(res=>{if(!res.ok)throw new Error(res.status);return res.json()}),120)}
// ---- which cell each pixel shows. The run's own grid: 13 / 2.5 km, or on the fine runs
// (0.5 / 0.25 / 0.1 km) the 2.5 km grid refined f times, each fine cell worked out from the
// 2.5 km frame (bilinear) plus, for temperatures, lapse rate x (2.5 km - fine terrain height).
// Two canvases: the whole domain ('data') and, zoomed in past that, the visible area at screen
// resolution ('detail'), so a pixel always shows a single cell of the run's grid.
const fineF=()=>meta().fine?meta().fine.f:1;
function cellGrid(){const g=meta().grid,f=fineF();
  return f>1?Object.assign({},g,{nx:(g.nx-1)*f+1,ny:(g.ny-1)*f+1,dx:g.dx/f}):g}
// Lambert conformal (spherical, as pyproj with R). rho depends only on latitude and theta only
// on longitude: x = rho sin(theta), y = rho0 - rho cos(theta)
function lcc(g){
  const r=Math.PI/180, f1=g.lat1*r, f2=g.lat2*r, t=f=>Math.tan(Math.PI/4+f/2);
  const n=Math.abs(f1-f2)<1e-10?Math.sin(f1):Math.log(Math.cos(f1)/Math.cos(f2))/Math.log(t(f2)/t(f1));
  const F=Math.cos(f1)*Math.pow(t(f1),n)/n, rho0=g.R*F/Math.pow(t(f1),n);
  return {rho0, rho:lat=>g.R*F/Math.pow(t(lat*r),n), th:lng=>n*((((lng-g.lon0)%360)+540)%360-180)*r,
    inv:(x,y)=>{const dy=rho0-y, sg=n<0?-1:1, rh=sg*Math.hypot(x,dy), a=Math.atan2(sg*x,sg*dy);
      return [((g.lon0+a/n/r)%360+540)%360-180, (2*Math.atan(Math.pow(g.R*F/rh,1/n))-Math.PI/2)/r]}};
}
const merc=la=>Math.log(Math.tan(Math.PI/4+la*Math.PI/360));   // Web Mercator y (radians)
const unmerc=y=>Math.atan(Math.sinh(y))*180/Math.PI;
const NONE=65535, CHUNK=512, dzCache=new Map();
function dzChunk(s,cj,ci){const r=run();
  return lru(dzCache,r.id+'/'+r.stamp+'/'+s+'/'+cj+'/'+ci,()=>load(STATIC?'terrain/'+r.terrain+'/'+s+'/'+cj+'_'+ci+'.bin.gz':
    'api/dz?run='+r.id+'&s='+s+'&cj='+cj+'&ci='+ci+'&v='+r.stamp),160)}
// pixel -> fine-grid cell (J, I) for a canvas covering bounds [west, south, east, north]. On the
// fine grids each pixel takes the nearest of every s-th cell, s (a power of 2) about the cells
// per pixel, so the terrain needed comes in a few blocks of that stride (dz per pixel).
async function geometry(b,w,h){
  const r=run(), g=cellGrid(), f=fineF(), P=lcc(g), N=w*h, J=new Uint16Array(N).fill(NONE), I=new Uint16Array(N);
  const cpp=(b[2]-b[0])/w*111320*Math.cos((b[1]+b[3])*Math.PI/360)/g.dx;
  let s=1; if(f>1)while(s*2<=cpp*1.25)s*=2;
  const S=new Float64Array(w), C=new Float64Array(w), y0=merc(b[3]), y1=merc(b[1]);
  for(let x=0;x<w;x++){const a=P.th(b[0]+(x+0.5)/w*(b[2]-b[0]));S[x]=Math.sin(a);C[x]=Math.cos(a)}
  let j0=1e9,j1=-1,i0=1e9,i1=-1;
  for(let y=0;y<h;y++){const rh=P.rho(unmerc(y0-(y+0.5)/h*(y0-y1)));
    for(let x=0;x<w;x++){const fi=(rh*S[x]-g.x0)/g.dx, fj=(P.rho0-rh*C[x]-g.y0)/g.dx;
      if(fi<-0.5||fj<-0.5||fi>=g.nx-0.5||fj>=g.ny-0.5)continue;
      let i=Math.round(fi/s)*s, j=Math.round(fj/s)*s; if(i>g.nx-1)i-=s; if(j>g.ny-1)j-=s;
      const p=y*w+x; J[p]=j; I[p]=i;
      if(j<j0)j0=j; if(j>j1)j1=j; if(i<i0)i0=i; if(i>i1)i1=i;}}
  const G={b,w,h,s,J,I,dz:null,run:r.id};
  if(f>1&&j1>=0){
    const rows=Math.floor((g.ny-1)/s)+1, cols=Math.floor((g.nx-1)/s)+1, keys=[];
    for(let cj=Math.floor(j0/s/CHUNK);cj<=Math.floor(j1/s/CHUNK);cj++)for(let ci=Math.floor(i0/s/CHUNK);ci<=Math.floor(i1/s/CHUNK);ci++)keys.push([cj,ci]);
    const chunks=new Map(), got=await Promise.all(keys.map(([cj,ci])=>dzChunk(s,cj,ci)));
    keys.forEach(([cj,ci],k)=>chunks.set(cj*4096+ci,got[k]));
    const dz=G.dz=new Float32Array(N);

function cellValue(v,J,I,dz,f,nx,ny,lapse,near){

  const k=st.k;let when='';try{when=new Date(init+d.steps[k]*3600e3).toLocaleString('en-US',{timeZone:M.tz,weekday:'short',hour:'numeric'})}catch(e){}
  const PT={1:'rain',2:'snow',3:'mix',4:'freezing rain'};
  const now=[d.t[k]!=null?Math.round(d.t[k])+U.t:'', d.td[k]!=null?'dew point '+Math.round(d.td[k])+U.t:'',
    d.ws&&d.ws[k]!=null?'wind '+(d.wd&&Math.round(d.ws[k])>0?d.wd[k]+' ':'')+Math.round(d.ws[k])+' '+U.w:'',
    d.sky&&d.sky[k]!=null?Math.round(d.sky[k])+'% cloud':'',
    d.qpf&&d.qpf[k]>0?d.qpf[k].toFixed(metric?1:2)+' '+U.p+(d.ptype&&PT[d.ptype[k]]?' '+PT[d.ptype[k]]:''):''].filter(Boolean).join(' · ');
  let h='<div class="hd"><div><b>'+days.length+'-day forecast'+(near?' · '+near:'')+'</b><div class="sub">'+d.lat.toFixed(2)+', '+d.lon.toFixed(2)+
    ' · '+elev+' · '+esc(r.label)+'</div></div><button class="x" title="Close (Esc)">&times;</button></div>'+
    '<div class="now"><span class="k">F'+pad(d.steps[k])+' '+when+':</span> '+now+'</div><div class="sc"><div class="days">';
  days.forEach(D=>{const c=condition(D.sky,D.q,D.type,metric);
    const wind=D.whi==null?'–':(Math.round(D.whi)>0&&D.wdir?D.wdir+' ':'')+rng(D.wlo,D.whi,' '+U.w);
    const pr=D.q>=(metric?0.1:0.01)?D.q.toFixed(metric?1:2)+' '+U.p+(D.snow>=(metric?0.5:0.1)?', '+D.snow.toFixed(1)+' '+U.s+' snow':''):'';
    h+='<div class="day"'+(D.partial?' title="The run covers only part of this day"':'')+'><div class="dn">'+D.wd+'</div><div class="dd">'+D.md+(D.partial?'*':'')+'</div>'+
      icon(c[1])+'<div class="cond">'+c[0]+'</div><div class="hl"><span class="hi">'+deg(D.hi)+'</span> <span class="k">/</span> <span class="lo">'+deg(D.lo)+'</span></div>'+
      '<div class="row"><span class="k">Dew</span> '+rng(D.dlo,D.dhi,'°')+'</div><div class="row">'+wind+'</div>'+
      '<div class="row" style="color:#2f7bd9;min-height:1.45em">'+pr+'</div></div>'});
  h+='</div>'+forecastChart(d,days,COL)+'</div><div class="key"><i style="background:#d9302a"></i>temperature<i style="background:#2f9e44"></i>dew point'+
    '<i style="background:#2f7bd9;height:8px;width:6px"></i>precip<i style="background:#8a94a6;height:8px;opacity:.6"></i>cloud cover'+
    ' · click the chart to show that hour on the map'+(days.some(D=>D.partial)?' · * part of the day only':'')+'</div>';
  const P=$('fc'); P.innerHTML=h; P.querySelector('.x').onclick=closeForecast;
  const svg=P.querySelector('.chart');
  if(svg)svg.onclick=e=>{const x=e.clientX-svg.getBoundingClientRect().left;let bi=-1,bd=1e9;
    fc.x.forEach((px,i)=>{if(px!=null&&Math.abs(px-x)<bd){bd=Math.abs(px-x);bi=i}});if(bi>=0){st.k=bi;show()}};
}
function forecastChart(d,days,COL){
  const W=days.length*COL, H=104, top=14, bot=H-4, init=new Date(d.run.init).getTime(), di={};
  days.forEach((D,j)=>di[D.key]=j);
  // x of each step inside the shown days, by the local clock so it lines up with the columns
  const X=fc.x=d.steps.map(s=>{const L=local(init+s*3600e3);return L.key in di?(di[L.key]+L.h/24)*COL:null});
  const idx=X.map((x,i)=>x==null?-1:i).filter(i=>i>=0); if(idx.length<2)return '';
  const vals=idx.flatMap(i=>[d.t[i],d.td[i]]).filter(v=>v!=null);
  const lo=Math.floor(Math.min(...vals)-2), hi=Math.ceil(Math.max(...vals)+2), Y=v=>top+(hi-v)/(hi-lo)*(bot-top-12);
  let g='';
  days.forEach((D,j)=>{if(j)g+='<line x1="'+j*COL+'" x2="'+j*COL+'" y1="0" y2="'+H+'" stroke="#dfe2e7"/>';
    g+='<line x1="'+(j+0.5)*COL+'" x2="'+(j+0.5)*COL+'" y1="'+top+'" y2="'+bot+'" stroke="#eef0f3"/>'});
  // cloud cover: a band along the top, darker = cloudier
  if(d.sky)idx.forEach((i,n)=>{if(d.sky[i]==null)return;
    const x0=n?(X[idx[n-1]]+X[i])/2:Math.max(0,X[i]-COL/16), x1=n<idx.length-1?(X[i]+X[idx[n+1]])/2:Math.min(W,X[i]+COL/16);
    g+='<rect x="'+x0.toFixed(1)+'" y="1" width="'+(x1-x0).toFixed(1)+'" height="9" fill="#8a94a6" fill-opacity="'+(0.06+0.8*d.sky[i]/100).toFixed(2)+'"/>'});
  const qmax=Math.max(M.units==='metric'?2.5:0.1,...idx.map(i=>d.qpf&&d.qpf[i]||0));
  idx.forEach(i=>{const q=d.qpf&&d.qpf[i];if(q>0){const h=Math.max(1,q/qmax*28);
    g+='<rect x="'+(X[i]-2.5).toFixed(1)+'" y="'+(bot-h).toFixed(1)+'" width="5" height="'+h.toFixed(1)+'" fill="'+(d.ptype&&d.ptype[i]===2?'#7aa7d9':'#2f7bd9')+'"/>'}});
  const line=(a,c)=>'<polyline fill="none" stroke="'+c+'" stroke-width="2" stroke-linejoin="round" points="'+
    idx.filter(i=>a[i]!=null).map(i=>X[i].toFixed(1)+','+Y(a[i]).toFixed(1)).join(' ')+'"/>';
  g+=line(d.td,'#2f9e44')+line(d.t,'#d9302a');
  g+='<text x="'+(W-3)+'" y="'+(Y(hi)+9)+'" font-size="10" fill="#777" text-anchor="end">'+hi+'°</text>'+
    '<text x="'+(W-3)+'" y="'+(Y(lo)-2)+'" font-size="10" fill="#777" text-anchor="end">'+lo+'°</text>';
  if(X[st.k]!=null)g+='<line x1="'+X[st.k].toFixed(1)+'" x2="'+X[st.k].toFixed(1)+'" y1="0" y2="'+H+'" stroke="#1f5fbf" stroke-width="1.5" stroke-dasharray="3,2"/>';
  return '<svg class="chart" width="'+W+'" height="'+H+'" style="background:#fafbfc;border-radius:4px">'+g+'</svg>';
}
// ---- capture: the map as it is now, with a header (product, valid time, model run) and the
// legend; or a range of hours as an MP4 (WebCodecs) or GIF, each frame shown for the chosen time
const GIFENC='https://cdn.jsdelivr.net/npm/gifenc@1.0.3/+esm', MP4MUX='https://cdn.jsdelivr.net/npm/mp4-muxer@5.2.1/+esm';
function rendered(){return new Promise(r=>{map.once('idle',()=>r());map.triggerRepaint()})}
function fmtTime(ms,o){try{return new Date(ms).toLocaleString('en-US',Object.assign({timeZone:M.tz},o))}catch(e){return new Date(ms).toUTCString()}}
function stampText(k){
  const r=run(), P=M.products[st.prod], s=ST[st.prod], init=new Date(r.init).getTime(), h=r.steps[k], vt=init+h*3600e3;
  const n=k?h-r.steps[k-1]:(r.steps[1]-r.steps[0])||3;
  return {title:P.title.replace('{n}',n)+' ('+s.unit+')',
    valid:'Valid '+fmtTime(vt,{weekday:'short',month:'short',day:'numeric',year:'numeric',hour:'numeric',timeZoneName:'short'})+
      '  ('+new Date(vt).toISOString().slice(11,13)+'Z)  ·  F'+pad(h),
    run:'ICON '+new Date(init).toISOString().slice(11,13)+'Z '+fmtTime(init,{timeZone:'UTC',weekday:'short',month:'short',day:'numeric',year:'numeric'})+' run',
    res:'ICON-MOS · '+M.domain+' · '+(r.res==='13km'?'13 km':r.res.replace('km',' km'))};
}
function drawLegend(x,cx,cy,maxW){   // the on-screen legend, drawn onto a canvas; returns its box
  const s=ST[st.prod], P=M.products[st.prod], pad=8, font='system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  const fmt=v=>s.discrete&&v<1?String(v).replace(/^0/,''):String(v);
  const bar=(lut,lev,bx,by,w)=>{const n=lev.length-1;for(let i=0;i<n;i++){const c=lut[i];x.fillStyle='rgba('+c[0]+','+c[1]+','+c[2]+','+(c[3]/255)+')';
    x.fillRect(bx+Math.floor(i*w/n),by,Math.ceil(w/n)+1,12)}};
  const ticks=(lev,tk,bx,by,w)=>{const n=lev.length-1;x.font='10px '+font;x.fillStyle='#1c2230';x.textAlign='center';
    tk.forEach(t=>{let i=lev.indexOf(t);if(i<0)i=(t-lev[0])/(lev[n]-lev[0])*n;x.fillText(fmt(t),bx+i/n*w,by+10)});x.textAlign='left'};
  const title=P.title.replace('{n}-h ','')+' ('+s.unit+')';
  let W,H;
  if(s.kind==='ptype'){const bw=Math.min(130,(maxW-2*pad-36)/4);W=4*bw+36+2*pad;H=62}else{W=Math.min(420,maxW-2*pad)+2*pad;H=52}
  const y0=cy-H;
  x.fillStyle='rgba(255,255,255,.93)';x.beginPath();x.roundRect?x.roundRect(cx,y0,W,H,6):x.rect(cx,y0,W,H);x.fill();
  x.fillStyle='#1c2230';x.font='600 12px '+font;x.textBaseline='alphabetic';x.fillText(title,cx+pad,y0+17,W-2*pad);
  if(s.kind==='ptype'){const n=s.levels.length,bw=(W-2*pad-36)/4;
    s.types.forEach((t,k)=>{const bx=cx+pad+k*(bw+12);x.font='11px '+font;x.fillStyle='#1c2230';x.fillText(t,bx,y0+31);
      rampBar(x,s.ramps[k],s.levels,bx,y0+35,bw,12);ticks(s.levels,s.levels.filter((_,i)=>i%2===0),bx,y0+48,bw)})}
  else{const w=W-2*pad;bar(s.lut.slice(1,-1),s.levels,cx+pad,y0+24,w);ticks(s.levels,s.ticks,cx+pad,y0+37,w)}
}
// the map canvas (WebGL, kept with preserveDrawingBuffer) + header + legend + attribution
function compose(maxW){
  const mc=map.getCanvas(), cw=mc.clientWidth, ch=mc.clientHeight, head=50;
  let sc=mc.width/cw; if(maxW&&cw*sc>maxW)sc=maxW/cw;
  const W=Math.round(cw*sc)&~1, H=Math.round((ch+head)*sc)&~1;
  const out=document.createElement('canvas'); out.width=W; out.height=H;
  const x=out.getContext('2d'), T=stampText(st.k), font='system-ui,-apple-system,Segoe UI,Roboto,sans-serif';
  x.setTransform(W/cw,0,0,H/(ch+head),0,0);
  x.fillStyle='#fff';x.fillRect(0,0,cw,head);
  x.drawImage(mc,0,head,cw,ch);
  if(particles.canvas.width)x.drawImage(particles.canvas,0,head,cw,ch);     // wind particles, as they are now
  x.fillStyle='#d5d9e0';x.fillRect(0,head-1,cw,1);
  x.fillStyle='#1c2230';x.font='700 15px '+font;x.fillText(T.title,10,20,cw*0.62);
  x.font='13px '+font;x.fillStyle='#1c2230';x.fillText(T.valid,10,40,cw*0.62);
  x.textAlign='right';x.font='600 13px '+font;x.fillText(T.run,cw-10,20,cw*0.36);
  x.font='12px '+font;x.fillStyle='#5b6474';x.fillText(T.res,cw-10,40,cw*0.36);x.textAlign='left';
  drawLegend(x,10,head+ch-10,cw-20);
  x.font='10px '+font;x.textAlign='right';x.fillStyle='rgba(255,255,255,.8)';
  const attr='© OpenFreeMap © OpenMapTiles © OpenStreetMap contributors';x.fillRect(cw-x.measureText(attr).width-10,head+ch-15,x.measureText(attr).width+10,15);
  x.fillStyle='#333';x.fillText(attr,cw-5,head+ch-4);x.textAlign='left';
  return out;
}
function download(blob,name){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),60000)}
const fileBase=()=>'ICON-MOS_'+st.prod+'_'+st.run;
const capMsg=t=>{$('cap_msg').textContent=t};
async function screenshot(){
  if(st.rec)return; play(false); capMsg('Capturing…');
  try{await show();await rendered();const c=compose(0);
    c.toBlob(b=>{download(b,fileBase()+'_F'+pad(run().steps[st.k])+'.png');capMsg('Saved '+c.width+' × '+c.height+' PNG')},'image/png');}
  catch(e){capMsg('Could not capture: '+e.message)}
}
function fillCapture(){
  const r=run(), opts=r.steps.map((h,i)=>'<option value="'+i+'">F'+pad(h)+'</option>').join('');
  const a=Math.min(+$('cap_a').value||0,r.steps.length-1), b=+$('cap_b').value;
  $('cap_a').innerHTML=opts;$('cap_b').innerHTML=opts;
  $('cap_a').value=a;$('cap_b').value=b&&b<r.steps.length?b:Math.min(a+8,r.steps.length-1);
}
async function mp4Writer(W,H,ms){
  if(!window.VideoEncoder)throw new Error('MP4 needs a browser with WebCodecs (Chrome, Edge, Safari 16.4+, Firefox 130+); try GIF');
  const {Muxer,ArrayBufferTarget}=await import(MP4MUX);
  let cfg=null;
  for(const codec of ['avc1.640034','avc1.640033','avc1.640028','avc1.4d0034','avc1.42003e']){
    const c={codec,width:W,height:H,bitrate:Math.max(2e6,Math.round(W*H*4)),framerate:Math.max(1,1000/ms)};
    try{if((await VideoEncoder.isConfigSupported(c)).supported){cfg=c;break}}catch(e){}}
  if(!cfg)throw new Error('this browser can\'t encode H.264 at '+W+' × '+H+'; try GIF');
  const target=new ArrayBufferTarget(), mux=new Muxer({target,video:{codec:'avc',width:W,height:H},fastStart:'in-memory'});
  let err=null; const enc=new VideoEncoder({output:(c,m)=>mux.addVideoChunk(c,m),error:e=>{err=e}});
  enc.configure(cfg); let n=0;
  return {add(cv){if(err)throw err;const f=new VideoFrame(cv,{timestamp:n*ms*1000,duration:ms*1000});enc.encode(f,{keyFrame:n%30===0});f.close();n++},
    async finish(){await enc.flush();if(err)throw err;enc.close();mux.finalize();return new Blob([target.buffer],{type:'video/mp4'})}};
}
async function gifWriter(W,H,ms){
  const {GIFEncoder,quantize,applyPalette}=await import(GIFENC), gif=GIFEncoder();
  return {add(cv){const d=cv.getContext('2d').getImageData(0,0,W,H).data, pal=quantize(d,256);
      gif.writeFrame(applyPalette(d,pal),W,H,{palette:pal,delay:ms})},
    async finish(){gif.finish();return new Blob([gif.bytes()],{type:'image/gif'})}};
}
async function record(){
  if(st.rec)return;
  let a=+$('cap_a').value, b=+$('cap_b').value; if(b<a)[a,b]=[b,a];
  const ms=Math.max(20,Math.min(60000,+$('cap_ms').value||500)), fmt=$('cap_fmt').value, keep=st.k, r=run();
  play(false); st.rec=true; $('rec').disabled=$('shot').disabled=true; $('shield').hidden=false;
  try{
    st.k=a; await show(); await rendered();
    let c=compose(fmt==='gif'?1000:1920); const W=c.width, H=c.height;
    capMsg('Loading the encoder…');
    const out=fmt==='gif'?await gifWriter(W,H,ms):await mp4Writer(W,H,ms);
    for(let k=a;k<=b;k++){
      capMsg('Frame '+(k-a+1)+' of '+(b-a+1)+'…');
      if(k>a){st.k=k;await show();await rendered();c=compose(W)}
      out.add(c); await new Promise(r=>setTimeout(r,0));
    }
    capMsg('Encoding…'); const blob=await out.finish();
    download(blob,fileBase()+'_F'+pad(r.steps[a])+'-F'+pad(r.steps[b])+'.'+fmt);
    capMsg('Saved '+(b-a+1)+' frames, '+W+' × '+H+', '+(blob.size/1048576).toFixed(1)+' MB '+fmt.toUpperCase());
  }catch(e){capMsg('Could not record: '+e.message)}
  finally{st.rec=false;$('rec').disabled=$('shot').disabled=false;$('shield').hidden=true;st.k=keep;show()}
}
$('shot').onclick=screenshot; $('rec').onclick=record;
// ---- controls
function step(dd){if(st.rec)return;const n=run().steps.length;st.k=(st.k+dd+n)%n;show();}
function play(on){clearTimeout(st.timer);st.timer=null;$('play').textContent='Play';
  if(on){$('play').textContent='Pause';const tick=async()=>{const t0=Date.now();step(1);
      try{await frame(st.prod,run().steps[st.k])}catch(e){} st.timer=setTimeout(tick,Math.max(0,450-(Date.now()-t0)))};
    st.timer=setTimeout(tick,0);}
  applyOpts();}
$('prev').onclick=()=>step(-1);$('next').onclick=()=>step(1);$('play').onclick=()=>play(!st.timer);
$('slider').oninput=e=>{if(st.rec){e.target.value=st.k;return}st.k=+e.target.value;show();};
document.addEventListener('keydown',e=>{
  if(['SELECT','INPUT'].includes(e.target.tagName)||st.rec)return;
  if(e.key==='Escape'&&!$('fc').hidden){closeForecast();e.preventDefault();return}
  if(e.key==='ArrowRight'){step(1);e.preventDefault();}
  else if(e.key==='ArrowLeft'){step(-1);e.preventDefault();}
  else if(e.key===' '){play(!st.timer);e.preventDefault();}
  else if(e.key==='ArrowUp'||e.key==='ArrowDown'){const ps=ordered();let i=ps.indexOf(st.prod)+(e.key==='ArrowDown'?1:-1);setProd(ps[(i+ps.length)%ps.length]);e.preventDefault();}
});
function selectRun(id){
  if(st.rec){$('run').value=st.run;return}
  st.run=id;$('run').value=id;play(false);store('maprun',id);
  if(!meta().products.includes(st.prod))st.prod=meta().products[0];
  st.k=Math.min(st.k,run().steps.length-1); geo.det=null; geo.overDone=null; st.v=null;
  if(ready)map.setLayoutProperty('detail','visibility','none');
  drawProducts();drawHours();legend();applyOpts();fillCapture();show().then(detail);
  if(fc.data)openForecast(fc.at);     // same spot, new run
}
$('run').onchange=()=>selectRun($('run').value);
const want=recall('maprun'); selectRun(RUNS.some(r=>r.id===want)?want:RUNS[0].id);
})();
</script>
